# The StarryOS preparation runner emits exactly 180 live-camera decisions.
# This remains a virtual actuator authorization profile until the physical
# executor and shared-controller topology pass their independent gates.
CONFIG_PM_CPU_OPS=y
CONFIG_POWEROFF=y
CONFIG_IVC_EXPECTED_VISION_DECISIONS=180
CONFIG_IVC_EXIT_AFTER_EXPECTED_COMMANDS=y
