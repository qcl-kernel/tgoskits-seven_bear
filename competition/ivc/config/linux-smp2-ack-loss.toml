# Neural-controller fault campaign. Resource placement is identical to
# linux-smp2.toml; only the VM name and finite command count differ.

[base]
id = 1
name = "linux-ivc-ack-loss"
guest_type = "virtualized"
cpu_num = 2
phys_cpu_ids = [1, 2]
phys_cpu_sets = [0x2, 0x4]
dedicated_cpus = true

[kernel]
entry_point = 0x8020_0000
image_location = "fs"
kernel_path = "/guest/linux/linux-qemu"
kernel_load_addr = 0x8020_0000
dtb_load_addr = 0x8000_0000
ramdisk_path = "/guest/linux/initramfs.cpio.gz"
ramdisk_load_addr = 0x8800_0000
cmdline = "console=ttyAMA0,115200 earlycon=pl011,0x09000000 devtmpfs.mount=1 loglevel=7 ivc.mode=neural ivc.count=100 ivc.period_ms=100"

memory_regions = [
  [0x8000_0000, 0x1000_0000, 0x7, 1],
]

[devices]
passthrough = []
disabled = []
virtual = [
  { id = "net0", model = "virtio-net-mmio", mac_suffix = 1, segment_id = 1 },
]
