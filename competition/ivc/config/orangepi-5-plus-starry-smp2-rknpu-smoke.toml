[base]
id = 1
name = "starry-rknpu-orangepi"
guest_type = "virtualized"
cpu_num = 2
phys_cpu_ids = [0x100, 0x200]
phys_cpu_sets = [0x2, 0x4]
dedicated_cpus = true

[kernel]
entry_point = 0x8020_0000
image_location = "fs"
kernel_path = "/home/orangepi/axvisor-guest/starryos-rknpu.bin"
kernel_load_addr = 0x8020_0000
dtb_load_addr = 0x8000_0000
dtb_path = "/home/orangepi/axvisor-guest/starry-orangepi-5-plus-rknpu.dtb"
cmdline = "console=ttyAMA0,115200 earlycon=pl011,0x09000000 root=/dev/vda rw"

# The RKNPU driver programs guest physical DMA addresses directly. Keep the
# complete guest RAM identity-mapped below 4 GiB and reserve the same host range
# in the service DTB before AxVisor initializes its allocator.
memory_regions = [
  [0x8000_0000, 0x1000_0000, 0x7, 2],
]

[devices]
passthrough = [{ path = "/npu@fdab0000" }]
disabled = []
virtual = [
  { id = "disk0", model = "virtio-blk-mmio", image_path = "/home/orangepi/axvisor-guest/starry-rknpu-rootfs-smoke.img" },
]
