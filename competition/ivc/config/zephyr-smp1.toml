[base]
id = 2
name = "zephyr-ivc-endpoint"
guest_type = "virtualized"
cpu_num = 1
phys_cpu_ids = [0]
phys_cpu_sets = [0x1]
# Reserve pCPU0 against every other registered guest vCPU. AxVisor's own
# housekeeping remains on pCPU3 by convention; this flag does not isolate
# arbitrary host tasks or QEMU threads.
dedicated_cpus = true

[kernel]
entry_point = 0x4000_100c
image_location = "memory"
kernel_path = "../zephyr/build/zephyr/zephyr.bin"
kernel_load_addr = 0x4000_0000
dtb_load_addr = 0x47e0_0000

# qemu_cortex_a53 links RAM at 0x4000_0000.
memory_regions = [
  [0x4000_0000, 0x0800_0000, 0x7, 0],
]

[devices]
passthrough = []
disabled = []

# Zephyr 4.3 accepts VERSION_1 and uses the modern 12-byte header without
# accepting MRG_RXBUF. Keep that transport contract explicit while the graph
# assigns net0's MMIO and virtual-controller input.
virtual = [
  { id = "net0", model = "virtio-net-mmio", mac_suffix = 2, segment_id = 1, header_mode = "fixed-twelve-byte" },
]
