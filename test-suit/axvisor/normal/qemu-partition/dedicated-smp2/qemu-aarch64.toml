args = [
  "-nographic",
  "-cpu",
  "cortex-a72",
  "-machine",
  "virt,virtualization=on,gic-version=3",
  "-smp",
  "4",
  "-append",
  "console=ttyAMA0,115200 earlycon=pl011,0x09000000 rdinit=/init devtmpfs.mount=1 loglevel=7",
  "-m",
  "8g",
]
fail_regex = [
  "(?m)^AXVISOR_DEDICATED_PARTITION_FAIL.*$",
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)kernel panic",
]
success_regex = ["(?m)^AXVISOR_DEDICATED_PARTITION_PASS online=.*$"]
shell_prefix = "~ #"
shell_init_cmd = '''
mount -t sysfs sysfs /sys 2>/dev/null || true
online="$(cat /sys/devices/system/cpu/online)"
count="$(getconf _NPROCESSORS_ONLN)"
if [ "$count" -eq 2 ]; then
  echo "AXVISOR_DEDICATED_PARTITION_PASS online=$online"
else
  echo "AXVISOR_DEDICATED_PARTITION_FAIL online=$online count=$count"
fi
'''
timeout = 180
to_bin = true
uefi = false
