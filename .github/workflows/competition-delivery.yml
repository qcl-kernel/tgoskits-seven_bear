name: Competition delivery

on:
  push:
    branches:
      - main
      - dev
    paths:
      - ".gitattributes"
      - ".github/workflows/competition-delivery.yml"
      - "competition/**"
  pull_request:
    paths:
      - ".gitattributes"
      - ".github/workflows/competition-delivery.yml"
      - "competition/**"

permissions:
  contents: read

concurrency:
  group: competition-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify competition host delivery gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full source history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run dependency-free delivery validation
        run: bash competition/evidence/run-host-validation.sh
